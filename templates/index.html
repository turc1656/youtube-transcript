<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Transcript Fetcher</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        textarea {
            resize: none;
        }
        .version {
            text-align: right;
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="card-title text-center mb-4">YouTube Transcript Fetcher</h1>
            <form method="post" class="mb-4">
                <div class="mb-3">
                    <label for="video_url" class="form-label">YouTube URL</label>
                    <input type="text" id="video_url" name="video_url" class="form-control" placeholder="Enter YouTube video URL" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Fetch Transcript</button>
            </form>
            {% if transcript %}
                <h2 class="h5 mb-3">Transcript:</h2>
                <textarea id="transcriptText" rows="10" class="form-control mb-3" readonly>{{ transcript }}</textarea>
                <button id="copyButton" class="btn btn-secondary w-100">Copy Transcript</button>
            {% endif %}
            <div class="version">v1.1.1</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var copyButton = document.getElementById("copyButton");
            if (copyButton) {
                copyButton.addEventListener("click", function() {
                    var transcriptText = document.getElementById("transcriptText");
                    
                    // Try using the modern clipboard API
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(transcriptText.value)
                            .then(function() {
                                alert("Transcript copied to clipboard!");
                            })
                            .catch(function(err) {
                                console.warn("Clipboard API failed, falling back. Error:", err);
                                fallbackCopy(transcriptText);
                            });
                    } else {
                        fallbackCopy(transcriptText);
                    }
                });
            }
        
            function fallbackCopy(textarea) {
                textarea.select();
                textarea.setSelectionRange(0, 99999); // For mobile devices
                try {
                    var successful = document.execCommand('copy');
                    if (successful) {
                        alert("Transcript copied to clipboard!");
                    } else {
                        alert("Copy failed. Please copy manually.");
                    }
                } catch (err) {
                    alert("Copy not supported in this browser.");
                }
            }
        });
        </script>        
    <!-- Bootstrap Bundle with Popper (optional for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
