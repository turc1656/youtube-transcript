<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Transcript Fetcher</title>
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Material 3 Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="card-title text-center">YouTube Transcript Fetcher</h1>
            <form id="transcriptForm" class="mb-4" novalidate>
                <div class="mb-3 form-group">
                    <label for="video_url" class="form-label">YouTube URL</label>
                    <input type="text" id="video_url" name="video_url" class="form-control" placeholder="Enter YouTube video URL" required>
                    <div class="validation-message" id="url-validation-message"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <span class="material-icons" style="margin-right: 8px;">search</span>
                    <span id="fetchBtnText">Fetch Transcript</span>
                    <div id="loadingSpinner" class="spinner" style="display: none;"></div>
                </button>
            </form>
            <div id="transcriptOutput" style="display: none;">
                <h2 class="h5 mb-3">Transcript:</h2>
                <textarea id="transcriptText" rows="10" class="form-control mb-3" readonly></textarea>
                <button id="copyButton" class="btn btn-secondary w-100">
                    <span class="material-icons" style="margin-right: 8px;">content_copy</span>
                    Copy Transcript
                </button>
                <a id="openChatGptButton" class="btn btn-primary w-100 mt-2" href="#" target="_blank" rel="noopener noreferrer" style="display: none;">
                    <span class="material-icons" style="margin-right: 8px;">chat</span>
                    Summarize in ChatGPT
                </a>
            </div>
            <div class="version">v2.1.1</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Form submission handler
            const form = document.getElementById("transcriptForm");
            const transcriptOutput = document.getElementById("transcriptOutput");
            const transcriptText = document.getElementById("transcriptText");
            const loadingSpinner = document.getElementById("loadingSpinner");
            const fetchBtnText = document.getElementById("fetchBtnText");
            const urlInput = document.getElementById("video_url");
            const validationMessage = document.getElementById("url-validation-message");
            const openChatGptButton = document.getElementById("openChatGptButton");
            
            // Custom validation
            function validateForm() {
                let isValid = true;
                
                // Check URL field
                if (!urlInput.value.trim()) {
                    validationMessage.textContent = "Please enter a YouTube URL";
                    validationMessage.style.display = "block";
                    // Use our new explicit class instead of 'invalid'
                    urlInput.classList.add("error-thick-border");
                    isValid = false;
                } else {
                    validationMessage.textContent = "";
                    validationMessage.style.display = "none";
                    urlInput.classList.remove("error-thick-border");
                }
                
                return isValid;
            }
            
            // Remove validation message when typing
            urlInput.addEventListener("input", function() {
                validationMessage.style.display = "none";
                // Remove our new class instead of 'invalid'
                urlInput.classList.remove("error-thick-border");
            });

            form.addEventListener("submit", function(e) {
                e.preventDefault(); // Prevent traditional form submission
                
                // Run custom validation
                if (!validateForm()) {
                    return;
                }
                
                const videoUrl = urlInput.value;
                
                // Show loading state
                loadingSpinner.style.display = "inline-block";
                fetchBtnText.textContent = "Fetching...";
                
                // Use fetch API to submit form data
                fetch("/fetch_transcript", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: `video_url=${encodeURIComponent(videoUrl)}`
                })
                .then(response => response.json())
                .then(data => {
                    // Hide loading state
                    loadingSpinner.style.display = "none";
                    fetchBtnText.textContent = "Fetch Transcript";
                    
                    // Display the transcript
                    if (data.success) {
                        transcriptOutput.style.display = "block";
                        transcriptText.value = data.transcript;

                        if (data.chatgpt_url) {
                            openChatGptButton.href = data.chatgpt_url;
                            openChatGptButton.style.display = "inline-flex";
                        } else {
                            openChatGptButton.href = "#";
                            openChatGptButton.style.display = "none";
                        }
                    } else {
                        openChatGptButton.href = "#";
                        openChatGptButton.style.display = "none";
                        // Build detailed error message with debug info
                        let errorMessage = data.message || "Error fetching transcript";
                        
                        // If debug info exists, log it to console and optionally show in toast
                        if (data.debug) {
                            console.error("Debug Info:", {
                                status: data.debug.status,
                                headers: data.debug.headers,
                                preview: data.debug.preview
                            });
                            
                            // Optionally append status to user message
                            if (data.debug.status) {
                                errorMessage += ` (Status: ${data.debug.status})`;
                            }
                        }
                        
                        showToast(errorMessage);
                    }

                    // Remaining API Quota Information
                    if (data.requests_remaining) {
                        // Remove existing rate limit info if it exists
                        const existingRateLimitInfo = document.getElementById('rate-limit-info');
                        if (existingRateLimitInfo) {
                            existingRateLimitInfo.remove();
                        }
                        
                        const apiQuotaDiv = document.createElement('div');
                        apiQuotaDiv.id = 'rate-limit-info';
                        apiQuotaDiv.style.marginTop = '10px';
                        apiQuotaDiv.style.fontSize = '14px';
                        apiQuotaDiv.style.color = '#666';
                        apiQuotaDiv.innerHTML = `
                            <div>API calls remaining: ${data.requests_remaining}</div>
                            ${data.quota_reset ? `<div>Quota resets in: ${data.quota_reset}</div>` : ''}
                        `;
                        
                        // Insert after the copy button
                        const copyButton = document.getElementById('copyButton');
                        copyButton.parentNode.insertBefore(apiQuotaDiv, openChatGptButton.nextSibling);
                    }
                })
                .catch(error => {
                    // Hide loading state
                    loadingSpinner.style.display = "none";
                    fetchBtnText.textContent = "Fetch Transcript";

                    openChatGptButton.href = "#";
                    openChatGptButton.style.display = "none";
                    
                    showToast("Error fetching transcript. Please try again.");
                    console.error("Error:", error);
                });
            });
            
            // Copy button handler
            const copyButton = document.getElementById("copyButton");
            if (copyButton) {
                copyButton.addEventListener("click", function() {
                    var transcriptText = document.getElementById("transcriptText");
                    
                    // Try using the modern clipboard API
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(transcriptText.value)
                            .then(function() {
                                showToast("Transcript copied to clipboard!");
                            })
                            .catch(function(err) {
                                console.warn("Clipboard API failed, falling back. Error:", err);
                                fallbackCopy(transcriptText);
                            });
                    } else {
                        fallbackCopy(transcriptText);
                    }
                });
            }
        
            function fallbackCopy(textarea) {
                textarea.select();
                textarea.setSelectionRange(0, 99999); // For mobile devices
                try {
                    var successful = document.execCommand('copy');
                    if (successful) {
                        showToast("Transcript copied to clipboard!");
                    } else {
                        showToast("Copy failed. Please copy manually.");
                    }
                } catch (err) {
                    showToast("Copy not supported in this browser.");
                }
            }
            
            // Create a toast notification instead of alert
            function showToast(message) {
                // Check if a toast container already exists
                let toastContainer = document.querySelector('.toast-container');
                
                if (!toastContainer) {
                    toastContainer = document.createElement('div');
                    toastContainer.className = 'toast-container';
                    document.body.appendChild(toastContainer);
                }
                
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerText = message;
                
                toastContainer.appendChild(toast);
                
                // Listen for the animation end event instead of using setTimeout
                toast.addEventListener('animationend', function() {
                    toast.remove();
                    // Check if container is empty and remove it
                    if (!toastContainer.hasChildNodes()) {
                        toastContainer.remove();
                    }
                });
            }
        });
    </script>
</body>
</html>
